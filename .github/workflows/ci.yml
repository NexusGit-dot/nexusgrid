
name: Odoo 17 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ruff:
    name: Python code quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

  unit-tests:
    name: Addon validator tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run unit tests
        run: python -m unittest tests.test_addon_structure -v

  addon-validation:
    name: Validate Odoo addons
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate addon structure
        run: python scripts/check_addon_structure.py addons

  odoo-install-test:
    name: Odoo 17 module installation
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out NexusGrid
        uses: actions/checkout@v4

      - name: Check out Odoo 17
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: 17.0
          path: odoo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev

      - name: Install Odoo dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r odoo/requirements.txt

      - name: Install Nexus Hello module
        run: |
          python odoo/odoo-bin \
            --addons-path=odoo/addons,addons \
            --db_host=127.0.0.1 \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            -d nexus_hello_test \
            --stop-after-init \
            -i nexus_hello
